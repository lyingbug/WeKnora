apiVersion: weknora/v1
kind: websearch
id: keenable
name: Keenable
description: Keenable AI search API.

config:
  - id: api_key
    type: string
    label: API Key
    required: true
    secret: true
  - id: mode
    type: enum
    label: Search mode
    default: fast
    options:
      - value: fast
        label: Fast
      - value: deep
        label: Deep

runtime:
  type: http
  request:
    method: POST
    url: https://api.keenable.ai/v1/search
    headers:
      X-API-Key: ${config.api_key}
      X-Keenable-Title: WeKnora
    body:
      query: ${input.query}
      mode: ${config.mode}
  response:
    items: results
    fields:
      title: title
      url: url
      snippet: description
      published_at: published_at
